name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          path = pathlib.Path("custom_components/eink_panel/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          version = data["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit(f"Unsupported version: {version}")
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              versions = [tuple(map(int, version.split(".")))]
              tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True)
              for existing_tag in tags.splitlines():
                  if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", existing_tag):
                      versions.append(tuple(map(int, existing_tag[1:].split("."))))
              major, minor, patch = max(versions)
              bump = os.environ["BUMP"]
              if bump == "patch":
                  patch += 1
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  raise SystemExit(f"Unsupported increment: {bump}")
              version = f"{major}.{minor}.{patch}"
              tag = f"v{version}"
              if subprocess.run(["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"]).returncode == 0:
                  raise SystemExit(f"Tag already exists: {tag}")
              data["version"] = version
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          elif os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Tag does not match manifest version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag=v{version}\n")
          PY
      - name: Commit release version and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add custom_components/eink_panel/manifest.json
          git commit -m "Release $TAG"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
