name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 0 * * 0"

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python
        run: python -m py_compile custom_components/eink_panel/__init__.py
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/eink_panel/manifest.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Reject private configuration
        run: |
          if grep -RIE "192\\.168\\.|access_key: *[\"'][0-9a-f]{16,}" . \
            --exclude-dir=.git; then
            echo "A local address or access key was found"
            exit 1
          fi
