<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-Ink Home</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #000;
      font-family: Arial, sans-serif;
    }
    body { text-align: center; }
    .project-version { margin-top: 3px; font-size: 12px; color: #555; }
    .page { padding: 5px 14px; }
    #date {
      font-size: 22px;
      font-weight: bold;
      margin: 1px 0 5px 0;
    }
    .line {
      border-top: 2px solid #000;
      margin: 5px 0;
    }
    .weather-main {
      width: 100%;
      text-align: left;
      white-space: nowrap;
    }
    .weather-icon {
      display: inline-block;
      width: 23%;
      vertical-align: middle;
      text-align: center;
    }
    .weather-icon img {
      width: 82px;
      height: 82px;
    }
    .weather-condition-block {
      display: inline-block;
      width: 43%;
      vertical-align: middle;
      white-space: normal;
    }
    #weather-condition {
      font-size: 29px;
      font-weight: bold;
    }
    .weather-temp-block {
      display: inline-block;
      width: 31%;
      vertical-align: middle;
      text-align: right;
    }
    #weather-temp {
      font-size: 47px;
      font-weight: bold;
    }
    #weather-range {
      margin-top: 2px;
      font-size: 18px;
      color: #555;
    }
    .wind-row {
      display: table;
      width: 100%;
      margin: 2px 0 5px 0;
      font-size: 19px;
      text-align: left;
    }
    .wind-symbol {
      display: table-cell;
      width: 10%;
      font-size: 28px;
      font-weight: bold;
      vertical-align: middle;
    }
    .wind-label {
      display: table-cell;
      width: 35%;
      vertical-align: middle;
    }
    #weather-wind {
      display: table-cell;
      width: 52%;
      text-align: right;
      vertical-align: middle;
    }
    .forecast-title {
      margin: 2px 0;
      font-size: 21px;
      font-weight: bold;
      text-align: left;
    }
    .forecast-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin-top: 0;
    }
    .forecast-table td {
      padding: 1px;
      vertical-align: top;
      font-size: 17px;
    }
    .forecast-day { min-height: 17px; font-size: 15px; }
    .forecast-time { color: #555; }
    .forecast-temp { font-weight: bold; font-size: 22px; margin: 1px 0; }
    .forecast-icon {
      display: block;
      width: 46px;
      height: 46px;
      margin: 2px auto;
    }
    .indoor-title {
      font-size: 22px;
      font-weight: bold;
      margin-top: 2px;
    }
    .sensor {
      display: inline-block;
      width: 32%;
      margin-top: 1px;
    }
    .sensor-label { font-size: 17px; }
    .sensor-value { font-size: 34px; font-weight: bold; }
    .sensor-unit { font-size: 17px; font-weight: normal; }
    .lock-row {
      display: table;
      width: 100%;
      margin-top: 3px;
    }
    .lock-title {
      display: table-cell;
      width: 45%;
      vertical-align: middle;
      text-align: left;
      font-size: 24px;
      font-weight: bold;
    }
    .lock-control {
      display: table-cell;
      width: 55%;
      vertical-align: middle;
      text-align: right;
    }
    #lock-toggle {
      padding: 2px;
      border: 0;
      background: #fff;
      color: #000;
      font-size: 19px;
      font-weight: bold;
      white-space: nowrap;
    }
    .toggle-track {
      position: relative;
      display: inline-block;
      width: 76px;
      height: 36px;
      border: 3px solid #000;
      border-radius: 22px;
      background: #fff;
      vertical-align: middle;
    }
    .toggle-knob {
      position: absolute;
      display: block;
      left: 4px;
      top: 4px;
      width: 28px;
      height: 28px;
      border-radius: 16px;
      background: #000;
    }
    #lock-toggle.open .toggle-track { background: #aaa; }
    #lock-toggle.open .toggle-knob { left: 44px; }
    .lock-icon {
      display: inline-block;
      width: 30px;
      height: 36px;
      margin-right: 5px;
      vertical-align: middle;
    }
    .lock-icon .lock-open, .lock-icon .lock-closed { display: none; }
    #lock-toggle.open .lock-open, #lock-toggle.closed .lock-closed { display: inline; }
    #lock-toggle.open .lock-unknown, #lock-toggle.closed .lock-unknown { display: none; }
    #lock-toggle.unavailable { color: #777; }
    #message {
      min-height: 17px;
      margin-top: 2px;
      font-size: 15px;
      font-weight: bold;
    }
    #updated { margin-top: 1px; font-size: 12px; }
    .vacuum-row { display: table; width: 100%; margin-top: 3px; }
    .vacuum-heading {
      display: table-cell; vertical-align: middle; text-align: left;
      font-size: 24px; font-weight: bold;
    }
    #lock-toggle-text, #vacuum-status { display: block; font-size: 15px; font-weight: normal; }
    .vacuum-buttons {
      display: table-cell; vertical-align: middle; text-align: right;
      white-space: nowrap;
    }
    .vacuum-buttons button {
      width: 48px; height: 44px; padding: 6px; margin-left: 5px;
      border: 2px solid #000; background: #fff; color: #000;
      vertical-align: middle;
    }
    .vacuum-buttons svg { display: block; width: 28px; height: 28px; margin: auto; }
    .vacuum-buttons button:disabled { color: #777; border-color: #777; }
    #vacuum-message { min-height: 17px; font-size: 15px; }
    .error { border: 4px solid #000; padding: 8px; }
  </style>
</head>
<body>
  <div class="page" id="page">
    <div id="date">Загрузка...</div>

    <div class="line"></div>

    <div class="weather-main">
      <div class="weather-icon"><img id="weather-icon" alt="Погода"></div>
      <div class="weather-condition-block">
        <div id="weather-condition">Получение погоды...</div>
      </div>
      <div class="weather-temp-block">
        <div id="weather-temp">—°</div>
        <div id="weather-range">—</div>
      </div>
    </div>

    <div class="wind-row">
      <span class="wind-symbol">≋</span>
      <span class="wind-label">Ветер</span>
      <span id="weather-wind">—</span>
    </div>

    <div class="forecast-title">Прогноз:</div>
    <table class="forecast-table">
      <tr>
        <td>
          <div class="forecast-day" id="f0-day"></div>
          <div class="forecast-time" id="f0-time">--:--</div>
          <img class="forecast-icon" id="f0-icon" alt="">
          <div class="forecast-temp" id="f0-temp">—</div>
        </td>
        <td>
          <div class="forecast-day" id="f1-day"></div>
          <div class="forecast-time" id="f1-time">--:--</div>
          <img class="forecast-icon" id="f1-icon" alt="">
          <div class="forecast-temp" id="f1-temp">—</div>
        </td>
        <td>
          <div class="forecast-day" id="f2-day"></div>
          <div class="forecast-time" id="f2-time">--:--</div>
          <img class="forecast-icon" id="f2-icon" alt="">
          <div class="forecast-temp" id="f2-temp">—</div>
        </td>
        <td>
          <div class="forecast-day" id="f3-day"></div>
          <div class="forecast-time" id="f3-time">--:--</div>
          <img class="forecast-icon" id="f3-icon" alt="">
          <div class="forecast-temp" id="f3-temp">—</div>
        </td>
        <td>
          <div class="forecast-day" id="f4-day"></div>
          <div class="forecast-time" id="f4-time">--:--</div>
          <img class="forecast-icon" id="f4-icon" alt="">
          <div class="forecast-temp" id="f4-temp">—</div>
        </td>
      </tr>
    </table>

    <div class="indoor-title">Гостиная</div>
    <div class="sensor">
      <div class="sensor-label">Температура</div>
      <div class="sensor-value" id="indoor-temp">—</div>
    </div>
    <div class="sensor">
      <div class="sensor-label">Влажность</div>
      <div class="sensor-value" id="indoor-humidity">—</div>
    </div>
    <div class="sensor">
      <div class="sensor-label">CO₂</div>
      <div class="sensor-value"><span id="indoor-co2">—</span> <span class="sensor-unit" id="indoor-co2-unit"></span></div>
    </div>

    <div class="line"></div>

    <div class="lock-row">
      <div class="lock-title" id="lock-heading">Домофон<span id="lock-toggle-text" aria-live="polite">Получение состояния...</span></div>
      <div class="lock-control">
        <button id="lock-toggle" class="unavailable" onclick="lockPressed()" aria-labelledby="lock-heading" disabled>
          <svg class="lock-icon" viewBox="0 0 32 36" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <g class="lock-closed"><path d="M9 16V10a7 7 0 0 1 14 0v6"/><rect x="5" y="16" width="22" height="17" rx="2"/><path d="M16 23v4"/></g>
              <g class="lock-open"><path d="M9 16V10a7 7 0 0 1 14 0"/><rect x="5" y="16" width="22" height="17" rx="2"/><path d="M16 23v4"/></g>
              <g class="lock-unknown"><circle cx="16" cy="18" r="13"/><path d="M12 14a4 4 0 1 1 6 3.5c-2 1-2 2-2 3M16 26h0"/></g>
            </g>
          </svg>
          <span class="toggle-track"><span class="toggle-knob"></span></span>
        </button>
      </div>
    </div>
    <div id="vacuum-panel" style="display: none;">
      <div class="line"></div>
      <div class="vacuum-row">
        <div class="vacuum-heading">Пылесос<span id="vacuum-status">Получение состояния...</span></div>
        <div class="vacuum-buttons">
          <button id="vacuum-start" onclick="vacuumPressed('start')" title="Начать уборку" aria-label="Начать уборку" disabled><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path d="M8 4L24 14L8 24Z" fill="currentColor"/></svg></button>
          <button id="vacuum-pause" onclick="vacuumPressed('pause')" title="Пауза" aria-label="Пауза" style="display: none;" disabled><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path d="M6 4H12V24H6ZM17 4H23V24H17Z" fill="currentColor"/></svg></button>
          <button id="vacuum-stop" onclick="vacuumPressed('stop')" title="Стоп" aria-label="Стоп" disabled><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><rect x="5" y="5" width="18" height="18" fill="currentColor"/></svg></button>
          <button id="vacuum-return_to_base" onclick="vacuumPressed('return_to_base')" title="На базу" aria-label="На базу" disabled><svg viewBox="0 0 28 28" aria-hidden="true" focusable="false"><path d="M3 13L14 3L25 13M6 11V25H22V11M11 25V17H17V25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
        </div>
      </div>
      <div id="vacuum-message" aria-live="polite"></div>
    </div>
    <div id="message">Ожидание данных</div>
    <div id="updated">Данные ещё не обновлялись</div>
    <div class="project-version">E-Ink Panel v__PROJECT_VERSION_HTML__</div>
  </div>

  <script>
    var panelKey = __PANEL_KEY_JSON__;
    var lockLabel = __LOCK_LABEL_JSON__;
    var commandPending = false;
    var lockAction = "unavailable";
    var vacuumPending = false;
    var vacuumLoading = false;
    var vacuumRevision = 0;
    var vacuumActions = [];
    var vacuumState = "unknown";

    function setText(id, value) {
      var element = document.getElementById(id);
      if (typeof element.textContent !== "undefined") {
        element.textContent = value;
      } else {
        element.innerText = value;
      }
    }

    function pad(value) {
      return value < 10 ? "0" + value : "" + value;
    }

    function updateDate() {
      var now = new Date();
      var months = [
        "января", "февраля", "марта", "апреля", "мая", "июня",
        "июля", "августа", "сентября", "октября", "ноября", "декабря"
      ];
      var weekdays = [
        "воскресенье", "понедельник", "вторник", "среда",
        "четверг", "пятница", "суббота"
      ];
      setText(
        "date",
        weekdays[now.getDay()] + ", " + now.getDate() + " " + months[now.getMonth()]
      );
    }

    function fitPage() {
      var page = document.getElementById("page");
      var available =
        window.innerHeight ||
        document.documentElement.clientHeight ||
        document.body.clientHeight;
      page.style.zoom = "1";
      if (available > 0 && page.scrollHeight > available) {
        page.style.zoom = String((available - 2) / page.scrollHeight);
      }
    }

    function request(method, path, callback, query) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, path + "?key=" + encodeURIComponent(panelKey) + (query || ""), true);
      var completed = false;
      function finish(status, text) {
        if (completed) { return; }
        completed = true;
        clearTimeout(timer);
        callback(status, text);
      }
      var timer = setTimeout(function () {
        finish(0, "");
        xhr.abort();
      }, 30000);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          finish(xhr.status, xhr.responseText);
        }
      };
      xhr.send(null);
    }

    function updateVacuumButtons() {
      document.getElementById("vacuum-start").style.display = vacuumState === "cleaning" ? "none" : "inline-block";
      document.getElementById("vacuum-pause").style.display = vacuumState === "cleaning" ? "inline-block" : "none";
      var actions = ["start", "pause", "stop", "return_to_base"];
      var i, j, supported;
      for (i = 0; i < actions.length; i++) {
        supported = false;
        for (j = 0; j < vacuumActions.length; j++) {
          if (vacuumActions[j] === actions[i]) { supported = true; }
        }
        document.getElementById("vacuum-" + actions[i]).disabled = vacuumPending || !supported;
      }
    }

    function loadVacuum() {
      if (vacuumLoading || vacuumPending) { return; }
      vacuumLoading = true;
      var revision = vacuumRevision;
      request("GET", "/eink-panel/vacuum", function (status, text) {
        vacuumLoading = false;
        if (revision !== vacuumRevision) { return; }
        try {
          if (status !== 200) { throw new Error("connection"); }
          var data = JSON.parse(text);
          document.getElementById("vacuum-panel").style.display = data.configured ? "block" : "none";
          vacuumActions = data.available ? data.actions : [];
          vacuumState = data.state;
          setText("vacuum-status", data.label);
        } catch (error) {
          vacuumActions = [];
          vacuumState = "unavailable";
          setText("vacuum-status", "Нет связи");
        }
        updateVacuumButtons();
        fitPage();
      });
    }

    function vacuumPressed(action) {
      var button = document.getElementById("vacuum-" + action);
      if (vacuumPending || !button || button.disabled || button.style.display === "none") { return; }
      vacuumPending = true;
      vacuumRevision++;
      updateVacuumButtons();
      setText("vacuum-message", "Отправка команды...");
      request("POST", "/eink-panel/vacuum", function (status, text) {
        var message = status === 200 ? "Команда отправлена" :
          status === 0 ? "Нет ответа. Проверьте состояние пылесоса" : "Ошибка управления";
        try {
          var data = JSON.parse(text);
          if (data.message) { message = data.message; }
        } catch (error) {}
        setText("vacuum-message", message);
        setTimeout(function () {
          vacuumPending = false;
          vacuumActions = [];
          updateVacuumButtons();
          loadVacuum();
        }, 1500);
      }, "&action=" + encodeURIComponent(action));
    }

    function showForecast(items) {
      var i;
      var item;
      for (i = 0; i < 5; i++) {
        item = items && items[i] ? items[i] : null;
        if (item) {
          setText("f" + i + "-day", item.day);
          document.getElementById("f" + i + "-icon").src = weatherIconPath(
            item.icon_slot,
            item.code
          );
          setText("f" + i + "-time", item.time);
          setText("f" + i + "-temp", item.temperature);
        }
      }
    }

    function weatherIconPath(slot, condition) {
      return (
        "/eink-panel/weather-icon/" + encodeURIComponent(slot) +
        "?key=" + encodeURIComponent(panelKey) +
        "&condition=" + encodeURIComponent(condition || "cloudy")
      );
    }

    function normalToggleText() {
      if (lockAction === "unlock") {
        return "Закрыт";
      }
      if (lockAction === "lock") {
        return "Открыт";
      }
      return "Недоступен";
    }

    function toggleStateClass(extra) {
      var stateClass = "unavailable";
      if (lockAction === "unlock") {
        stateClass = "closed";
      } else if (lockAction === "lock") {
        stateClass = "open";
      }
      document.getElementById("lock-toggle").className =
        extra ? stateClass + " " + extra : stateClass;
    }

    function loadStatus() {
      request("GET", "/eink-panel/status", function (status, text) {
        if (status !== 200) {
          setText("message", "Нет связи с Home Assistant");
          return;
        }
        try {
          var data = JSON.parse(text);
          setText("weather-temp", data.weather.temperature + data.weather.unit);
          setText("weather-condition", data.weather.condition);
          setText("weather-range", data.weather.range);
          setText("weather-wind", data.weather.wind);
          document.getElementById("weather-icon").src = weatherIconPath(
            data.weather.icon_slot,
            data.weather.code
          );
          setText(
            "indoor-temp",
            data.indoor.temperature.value + data.indoor.temperature.unit
          );
          setText(
            "indoor-humidity",
            data.indoor.humidity.value + data.indoor.humidity.unit
          );
          var co2 = data.indoor.co2 || {value: "—", unit: ""};
          setText("indoor-co2", co2.value);
          setText("indoor-co2-unit", co2.unit);
          showForecast(data.forecast);
          var now = new Date();
          setText("updated", "Обновлено в " + pad(now.getHours()) + ":" + pad(now.getMinutes()));
          if (!commandPending) {
            lockAction = data.lock.available ? data.lock.action : "unavailable";

            if (!data.lock.available) {
              document.getElementById("lock-toggle").disabled = true;
              toggleStateClass("");
              setText("lock-toggle-text", "Недоступен");
              setText("message", "Домофон недоступен");
            } else {
              document.getElementById("lock-toggle").disabled = false;
              toggleStateClass("");
              setText("lock-toggle-text", normalToggleText());
              setText("message", "");
            }
          }
          setTimeout(fitPage, 50);
        } catch (error) {
          setText("message", "Ошибка данных");
        }
      });
    }

    function sendLockCommand() {
      commandPending = true;
      document.getElementById("lock-toggle").disabled = true;
      toggleStateClass("busy");
      setText(
        "lock-toggle-text",
        lockAction === "unlock" ? "Открываю..." : "Закрываю..."
      );
      setText("message", "Отправка команды");

      request("POST", "/eink-panel/lock", function (status, text) {
        var message = status === 200 ? "Команда отправлена" : "Ошибка управления";
        try {
          var data = JSON.parse(text);
          if (data.message) {
            message = data.message;
          }
        } catch (error) {}
        setText("message", message);
        setTimeout(function () {
          commandPending = false;
          loadStatus();
        }, 1500);
      });
    }

    function lockPressed() {
      if (commandPending || document.getElementById("lock-toggle").disabled ||
          (lockAction !== "unlock" && lockAction !== "lock")) {
        return;
      }
      sendLockCommand();
    }

    updateDate();
    loadStatus();
    loadVacuum();
    setTimeout(fitPage, 50);
    window.onresize = fitPage;
    setInterval(updateDate, 60000);
    setInterval(loadStatus, 300000);
    setInterval(loadVacuum, 15000);

    /* Reloading periodically helps clear accumulated E-Ink ghosting. */
    setTimeout(function () { window.location.reload(true); }, 1800000);
  </script>
</body>
</html>
